apiVersion: apps/v1
kind: Deployment
metadata:
  name: bloggingapp-deployment
  namespace: webapps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bloggingapp
  template:
    metadata:
      labels:
        app: bloggingapp
    spec:
      containers:
        - name: bloggingapp
          image: ton-pseudo-dockerhub/blogging-app:IMAGE_TAG # IMAGE_TAG remplacé par le pipeline (sed)
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
      imagePullSecrets:
        - name: regcred # image privée sur Docker Hub
---
apiVersion: v1
kind: Service
metadata:
  name: bloggingapp-ssvc
  namespace: webapps
spec:
  type: LoadBalancer
  selector:
    app: bloggingapp
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
