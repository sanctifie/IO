apiVersion: apps/v1
kind: Deployment
metadata:
  name: register-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: register-app
  template:
    metadata:
      labels:
        app: register-app
    spec:
      containers:
        - name: register-app
          image: REMPLACER-PAR-TON-PSEUDO-DOCKERHUB/register-app-pipeline:1.0.0-1
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet: { path: /webapp/, port: 8080 }
            initialDelaySeconds: 20
          ports:
            - containerPort: 8080
