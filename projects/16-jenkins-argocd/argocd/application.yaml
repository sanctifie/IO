# Projet 16 — kubectl apply -f argocd/application.yaml (équivalent du formulaire "New App")
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: register-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/REMPLACER/gitops-register-app.git
    targetRevision: HEAD
    path: ./
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
