# Projet 16 — SonarQube + PostgreSQL. Avant : sysctl vm.max_map_count=524288 (voir common/run-sonarqube.sh)
# Lancer : SONAR_DB_PASSWORD='un-mot-de-passe' docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?définir SONAR_DB_PASSWORD}
      POSTGRES_DB: sonarqube
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
  sonarqube:
    image: sonarqube:community
    depends_on: [db]
    ports: ["9000:9000"]
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD}
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    ulimits:
      nofile: { soft: 131072, hard: 131072 }
    restart: unless-stopped
volumes: { pgdata: {}, sonar_data: {}, sonar_extensions: {}, sonar_logs: {} }
