apiVersion: apps/v1
kind: Deployment
metadata:
  name: dotnet-app-deployment
  labels:
    app: dotnet-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dotnet-app
  template:
    metadata:
      labels:
        app: dotnet-app
    spec:
      containers:
        - name: dotnet-app
          # remplacé à chaque build par : kubectl set image ... :<numéro de build>
          image: ton-pseudo-dockerhub/dotnet-monitoring:latest
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: dotnet-app-service
spec:
  type: NodePort
  selector:
    app: dotnet-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
