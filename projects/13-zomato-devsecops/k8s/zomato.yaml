# Pour aller plus loin : déploiement Kubernetes en non-root
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zomato
  labels:
    app: zomato
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zomato
  template:
    metadata:
      labels:
        app: zomato
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # utilisateur nginx de l'image unprivileged
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: zomato
          image: TON-PSEUDO-DOCKERHUB/zomato:latest
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: zomato
spec:
  type: NodePort
  selector:
    app: zomato
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30008
