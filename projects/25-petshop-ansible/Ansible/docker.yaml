# Construit, pousse et lance l'image sur le serveur Jenkins.
# Variables passées par Jenkins (extraVars) : docker_user, docker_password, workspace, image_tag
- name: Docker build, push et run
  hosts: local
  become: true
  vars:
    image: "{{ docker_user }}/petstore"
    image_tag: latest

  tasks:
    - name: Construire l'image
      ansible.builtin.command: docker build -t "{{ image }}:{{ image_tag }}" -t "{{ image }}:latest" .
      args:
        chdir: "{{ workspace }}"
      changed_when: true

    - name: Se connecter à Docker Hub
      community.docker.docker_login:
        registry_url: https://index.docker.io/v1/
        username: "{{ docker_user }}"
        password: "{{ docker_password }}"
      no_log: true # le mot de passe n'apparaît jamais dans les logs

    - name: Pousser l'image
      ansible.builtin.command: "docker push {{ item }}"
      loop:
        - "{{ image }}:{{ image_tag }}"
        - "{{ image }}:latest"
      changed_when: true

    - name: Lancer (ou relancer) le conteneur — idempotent
      community.docker.docker_container:
        name: pet1
        image: "{{ image }}:{{ image_tag }}"
        state: started
        recreate: true
        restart_policy: unless-stopped
        published_ports:
          - "8081:8080"
