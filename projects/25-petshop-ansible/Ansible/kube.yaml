# Copie le manifeste sur le master et l'applique (rolling update, sans coupure).
# Variables : workspace, image (ex. moi/petstore:42)
- name: Déployer sur Kubernetes
  hosts: k8s
  gather_facts: false

  tasks:
    - name: Copier deployment.yaml sur le master
      ansible.builtin.copy:
        src: "{{ workspace }}/deployment.yaml"
        dest: /home/ubuntu/deployment.yaml
        owner: ubuntu
        mode: "0644"
      become: true

    - name: Appliquer le manifeste
      ansible.builtin.command: kubectl apply -f /home/ubuntu/deployment.yaml
      register: apply
      changed_when: "'configured' in apply.stdout or 'created' in apply.stdout"

    - name: Mettre l'image du build courant (déclenche le rolling update)
      ansible.builtin.command: "kubectl set image deployment/petshop petshop={{ image }}"
      when: image is defined
      changed_when: true

    - name: Attendre la fin du déploiement
      ansible.builtin.command: kubectl rollout status deployment/petshop --timeout=180s
      changed_when: false
