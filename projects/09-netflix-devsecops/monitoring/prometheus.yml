# /etc/prometheus/prometheus.yml du serveur de monitoring (projet 09)
# Valider puis recharger : promtool check config /etc/prometheus/prometheus.yml && curl -X POST localhost:9090/-/reload
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node_exporter
    static_configs:
      - targets: ['localhost:9100']

  # Étape 5 : plugin "Prometheus metrics" de Jenkins
  - job_name: jenkins
    metrics_path: /prometheus
    static_configs:
      - targets: ['10.0.1.10:8080'] # ← IP PRIVÉE du serveur Jenkins

  # Étape 9 : node_exporter installé sur les nœuds Kubernetes
  - job_name: k8s-nodes
    static_configs:
      - targets: ['10.0.1.20:9100', '10.0.1.21:9100'] # ← IP privées master, worker
