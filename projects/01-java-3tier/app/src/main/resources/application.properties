spring.mvc.view.prefix=/pages/
spring.mvc.view.suffix=.jsp

# La connexion à la base n'est PAS écrite ici (ni mot de passe dans Git).
# Elle est fournie par l'environnement au démarrage de Tomcat :
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# Valeurs par défaut pour un test local (docker run mysql) :
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/UserDB}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme}
