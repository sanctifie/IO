# Configuration Prometheus type (bible : leçon 15 et annexe A.7) — remplacer les <...>
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ['localhost:9090'] }]

  - job_name: node_exporter
    static_configs: [{ targets: ['localhost:9100'] }]   # ajouter '<IP_PRIVEE>:9100' pour les autres machines

